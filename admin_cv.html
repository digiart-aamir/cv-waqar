<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waqar Ahmed – CV Admin & Feature Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<!-- Fallback dataset -->
<script src="cv_data.js"></script>
<style>
:root {
  --bg-admin: #090d16;
  --panel-bg: #0f172a;
  --panel-card: #1e293b;
  --panel-border: rgba(255, 255, 255, 0.1);
  --text-light: #f8fafc;
  --text-dim: #94a3b8;
  --accent-blue: #38bdf8;
  --primary-blue: #2563eb;
  --primary-blue-dark: #1d4ed8;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;

  --sheet-bg: #ffffff;
  --sidebar-bg-start: #0f172a;
  --sidebar-bg-end: #1e293b;
  --sidebar-text: #e2e8f0;
  --sidebar-muted: #94a3b8;
  --sidebar-accent: #38bdf8;
  --text-main: #1e293b;
  --text-body: #334155;
  --text-muted: #64748b;
  --border-light: #e2e8f0;
  --card-bg: #f8fafc;

  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-admin);
  font-family: var(--font-sans);
  color: var(--text-light);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Studio Header */
.studio-header {
  height: 58px;
  background: #0b1120;
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 10;
}

.studio-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
}

.brand-badge {
  background: linear-gradient(135deg, #2563eb, #38bdf8);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

.studio-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  border: none;
  text-decoration: none;
}

.btn-primary {
  background: #2563eb;
  color: #ffffff;
}
.btn-primary:hover { background: #1d4ed8; }

.btn-success {
  background: #10b981;
  color: #ffffff;
}
.btn-success:hover { background: #059669; }

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: #f1f5f9;
  border: 1px solid var(--panel-border);
}
.btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

.btn-danger-outline {
  background: transparent;
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.4);
}
.btn-danger-outline:hover {
  background: rgba(239, 68, 68, 0.15);
}

.btn-sm {
  padding: 4px 8px;
  font-size: 11px;
}

/* 2-Section Workspace Layout */
.studio-layout {
  flex: 1;
  display: grid;
  grid-template-columns: 480px 1fr;
  overflow: hidden;
}

/* LEFT: Control & Feature Management Panel */
.admin-panel {
  background: var(--panel-bg);
  border-right: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tab-nav {
  display: flex;
  overflow-x: auto;
  background: rgba(11, 17, 32, 0.8);
  border-bottom: 1px solid var(--panel-border);
  padding: 6px 12px 0;
  gap: 4px;
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display: none; }

.tab-btn {
  padding: 8px 12px;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  color: var(--text-dim);
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.tab-btn:hover { color: #f1f5f9; }
.tab-btn.active {
  color: var(--accent-blue);
  border-bottom-color: var(--accent-blue);
}

.tab-content-area {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-group label {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent-blue);
}

.form-control {
  background: var(--panel-card);
  border: 1px solid var(--panel-border);
  color: #f8fafc;
  font-family: var(--font-sans);
  font-size: 13px;
  padding: 8px 11px;
  border-radius: 6px;
  outline: none;
  transition: border-color 0.15s ease;
}

.form-control:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
}

textarea.form-control {
  min-height: 80px;
  line-height: 1.5;
  resize: vertical;
}

/* Feature Item Card in Admin Panel */
.item-card {
  background: var(--panel-card);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
}

.item-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.item-card-title {
  font-size: 12.5px;
  font-weight: 700;
  color: #f1f5f9;
}

.bullets-edit-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.bullet-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.add-section-banner {
  background: rgba(56, 189, 248, 0.08);
  border: 1px dashed rgba(56, 189, 248, 0.35);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

/* RIGHT: Real-Time Live CV Preview Canvas */
.preview-panel {
  background: #060911;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.preview-toolbar {
  height: 44px;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  flex-shrink: 0;
}

.preview-title {
  font-size: 12px;
  font-weight: 600;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  gap: 6px;
}

.preview-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.preview-scroll-wrapper {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
  display: flex;
  justify-content: center;
  padding: 24px 20px 60px;
}

/* CV Document Sheet */
#cv-sheet {
  width: 860px;
  min-height: 1216px;
  background: var(--sheet-bg);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
  display: grid;
  grid-template-columns: 290px 1fr;
  position: relative;
  transform-origin: top center;
  flex-shrink: 0;
}

/* Internal CV Styles (Exact match to index.html) */
.cv-sidebar {
  background: linear-gradient(180deg, var(--sidebar-bg-start) 0%, var(--sidebar-bg-end) 100%);
  color: var(--sidebar-text);
  padding: 32px 24px 30px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  border-right: 1px solid rgba(255, 255, 255, 0.06);
}

.photo-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.photo-frame {
  width: 154px;
  height: 188px;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.6);
  background: #1e293b;
  position: relative;
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.sidebar-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar-heading {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--sidebar-accent);
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.sidebar-heading svg {
  width: 15px;
  height: 15px;
  stroke: var(--sidebar-accent);
  fill: none;
}

.contact-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.contact-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--sidebar-text);
}

.contact-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.07);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.contact-icon svg {
  width: 14px;
  height: 14px;
  stroke: #38bdf8;
  fill: none;
}

.skills-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.skill-tag {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #f1f5f9;
  font-size: 11px;
  font-weight: 500;
  padding: 4px 9px;
  border-radius: 6px;
}

.skill-tag.accent {
  background: rgba(56, 189, 248, 0.15);
  border-color: rgba(56, 189, 248, 0.35);
  color: #e0f2fe;
}

.lang-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.lang-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}

.lang-name {
  font-weight: 600;
  color: #f8fafc;
}

.lang-level {
  font-size: 10.5px;
  color: var(--sidebar-muted);
  background: rgba(255, 255, 255, 0.05);
  padding: 2px 7px;
  border-radius: 4px;
}

.interests-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.interest-card {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 600;
}

.interest-card svg {
  width: 16px;
  height: 16px;
  stroke: #38bdf8;
  fill: none;
}

.cv-main {
  padding: 36px 36px 30px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  background: #ffffff;
}

.main-header {
  border-bottom: 2px solid #f1f5f9;
  padding-bottom: 18px;
}

.name-title-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.candidate-name {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--primary);
  line-height: 1.1;
  text-transform: uppercase;
}

.candidate-role {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2.8px;
  color: var(--primary-blue);
  text-transform: uppercase;
  margin-top: 4px;
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--card-bg);
  color: var(--text-muted);
  border: 1px solid var(--border-light);
}

.badge-pill.featured {
  background: #eff6ff;
  color: #1d4ed8;
  border-color: #bfdbfe;
}

.badge-pill svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  fill: none;
}

.section-title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 9px;
  position: relative;
  margin-bottom: 12px;
}

.section-title-icon {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: #eff6ff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.section-title-icon svg {
  width: 14px;
  height: 14px;
  stroke: var(--primary-blue);
  fill: none;
}

.section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #e2e8f0;
  margin-left: 10px;
}

.profile-text {
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--text-body);
  text-align: justify;
  background: #f8fafc;
  padding: 12px 16px;
  border-radius: 8px;
  border-left: 3px solid var(--primary-blue);
}

.timeline {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-left: 16px;
}

.timeline::before {
  content: "";
  position: absolute;
  top: 6px;
  bottom: 6px;
  left: 4px;
  width: 2px;
  background: #e2e8f0;
}

.timeline-item {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.timeline-dot {
  position: absolute;
  left: -16px;
  top: 5px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ffffff;
  border: 2.5px solid var(--primary-blue);
  box-shadow: 0 0 0 2px #eff6ff;
}

.timeline-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}

.timeline-role {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--primary);
}

.timeline-date {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--primary-blue-dark);
  background: var(--primary-blue-light);
  padding: 2px 8px;
  border-radius: 12px;
  letter-spacing: 0.3px;
}

.timeline-org {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.timeline-bullets {
  margin-top: 5px;
  padding-left: 16px;
  display: flex;
  flex-direction: column;
  gap: 3.5px;
}

.timeline-bullets li {
  font-size: 11.8px;
  line-height: 1.48;
  color: var(--text-body);
}

.cert-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.cert-card {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  position: relative;
}

.cert-year {
  font-size: 10px;
  font-weight: 700;
  color: var(--primary-blue);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.cert-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.3;
}

.cert-issuer {
  font-size: 10.5px;
  color: var(--text-muted);
  line-height: 1.35;
}

.custom-section-item {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
}

/* Hide file inputs */
#jsonFileInput, #photoFileInput { display: none; }
</style>
</head>
<body>

<!-- Studio Header Bar -->
<header class="studio-header">
  <div class="studio-brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    <span>Waqar Ahmed</span>
    <span class="brand-badge">CV ADMIN STUDIO</span>
  </div>
  <div class="studio-actions">
    <a href="index.html" class="btn btn-secondary" target="_blank" title="Preview public uneditable CV">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
      View Public CV
    </a>
    <button class="btn btn-secondary" onclick="document.getElementById('jsonFileInput').click()" title="Load JSON file from computer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Import
    </button>
    <input type="file" id="jsonFileInput" accept=".json" onchange="handleFileImport(event)">
    <button class="btn btn-primary" onclick="exportJSON()" title="Download updated cv_data.json">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save &amp; Export JSON
    </button>
  </div>
</header>

<!-- Main Workspace (Left: Management | Right: Live CV Presentation) -->
<main class="studio-layout">

  <!-- LEFT: Management & Features Control -->
  <section class="admin-panel">
    <nav class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('general')">General</button>
      <button class="tab-btn" onclick="switchTab('experience')">Experience</button>
      <button class="tab-btn" onclick="switchTab('education')">Education</button>
      <button class="tab-btn" onclick="switchTab('certs')">Certs</button>
      <button class="tab-btn" onclick="switchTab('skills')">Skills</button>
      <button class="tab-btn" onclick="switchTab('custom')">+ New Feature</button>
    </nav>

    <div class="tab-content-area" id="adminFormContainer">
      <!-- Populated dynamically based on active tab -->
    </div>
  </section>

  <!-- RIGHT: Real-time CV Presentation -->
  <section class="preview-panel">
    <div class="preview-toolbar">
      <div class="preview-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Live Real-Time Preview (A4 Standard)</span>
      </div>
      <div class="preview-controls">
        <button class="btn btn-secondary btn-sm" onclick="setZoom(0.75)">75%</button>
        <button class="btn btn-secondary btn-sm" onclick="setZoom(0.88)">Fit</button>
        <button class="btn btn-secondary btn-sm" onclick="setZoom(1)">100%</button>
        <button class="btn btn-primary btn-sm" onclick="printCV()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print PDF
        </button>
      </div>
    </div>

    <div class="preview-scroll-wrapper">
      <div id="cv-sheet">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </section>

</main>

<script>
// Data State
let cvData = null;
let currentTab = 'general';
let currentZoom = 0.88;

async function initAdmin() {
  // 1. Fetch cv_data.json (fresh data with cache-buster)
  try {
    const res = await fetch('./cv_data.json?t=' + Date.now());
    if (res.ok) cvData = await res.json();
  } catch(e){}

  // 2. Fallback to window.CV_DEFAULT_DATA from cv_data.js
  if (!cvData && window.CV_DEFAULT_DATA) {
    cvData = JSON.parse(JSON.stringify(window.CV_DEFAULT_DATA));
  }

  // 3. Fallback to local session
  if (!cvData) {
    const cached = localStorage.getItem('waqar_cv_custom_data');
    if (cached) {
      try { cvData = JSON.parse(cached); } catch(e){}
    }
  }

  if (cvData) {
    if (!cvData.personal) cvData.personal = {};
    if (!cvData.contact) cvData.contact = {};
    if (!cvData.customSections) cvData.customSections = [];
    renderActiveTab();
    renderCVPreview();
    applyZoom();
  }
}

function switchTab(tabName) {
  currentTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick').includes(tabName));
  });
  renderActiveTab();
}

// Render Admin Control Panel on the Left
function renderActiveTab() {
  const container = document.getElementById('adminFormContainer');
  if (!container || !cvData) return;

  if (currentTab === 'general') {
    container.innerHTML = `
      <div class="form-group">
        <label>Full Name</label>

// Data Update Helpers (Real-time live sync to Preview & LocalStorage)
function updateField(path, value) {
  const parts = path.split('.');
  if (parts.length === 1) cvData[parts[0]] = value;
  else if (parts.length === 2) cvData[parts[0]][parts[1]] = value;
  saveAndRefresh();
}

function updateExp(idx, field, val) {
  cvData.experience[idx][field] = val;
  saveAndRefresh();
}

function updateBullet(expIdx, bIdx, val) {
  cvData.experience[expIdx].bullets[bIdx] = val;
  saveAndRefresh();
}

function addBullet(expIdx) {
  if (!cvData.experience[expIdx].bullets) cvData.experience[expIdx].bullets = [];
  cvData.experience[expIdx].bullets.push("New accomplishment or site responsibility");
  saveAndRefresh(true);
}

function deleteBullet(expIdx, bIdx) {
  cvData.experience[expIdx].bullets.splice(bIdx, 1);
  saveAndRefresh(true);
}

function addExperience() {
  cvData.experience.unshift({
    role: "Telecom Site Engineer",
    period: "2026 — PRESENT",
    organization: "New Company / Project",
    location: "Saudi Arabia",
    bullets: ["Executed site installations, field commissioning and quality adherence."]
  });
  saveAndRefresh(true);
}

function deleteExperience(idx) {
  if (confirm("Delete this experience entry?")) {
    cvData.experience.splice(idx, 1);
    saveAndRefresh(true);
  }
}

function updateEdu(idx, field, val) {
  cvData.education[idx][field] = val;
  saveAndRefresh();
}

function addEducation() {
  cvData.education.push({
    degree: "Degree / Diploma Name",
    year: "2026",
    institution: "University / Institute Name",
    location: "Location"
  });
  saveAndRefresh(true);
}

function deleteEducation(idx) {
  if (confirm("Delete this education entry?")) {
    cvData.education.splice(idx, 1);
    saveAndRefresh(true);
  }
}

function updateCert(idx, field, val) {
  cvData.certifications[idx][field] = val;
  saveAndRefresh();
}

function addCert() {
  cvData.certifications.push({
    year: "2026",
    title: "New Professional Certificate",
    issuer: "Issuing Organization"
  });
  saveAndRefresh(true);
}

function deleteCert(idx) {
  if (confirm("Delete this certificate?")) {
    cvData.certifications.splice(idx, 1);
    saveAndRefresh(true);
  }
}

function updateSkillName(idx, val) {
  cvData.skills[idx].name = val;
  saveAndRefresh();
}

function toggleSkillAccent(idx, val) {
  cvData.skills[idx].accent = val;
  saveAndRefresh();
}

function addSkill() {
  cvData.skills.push({ name: "New Technical Skill", accent: false });
  saveAndRefresh(true);
}

function deleteSkill(idx) {
  cvData.skills.splice(idx, 1);
  saveAndRefresh(true);
}

function addCustomSection() {
  if (!cvData.customSections) cvData.customSections = [];
  cvData.customSections.push({
    title: "PROJECTS & KEY ACHIEVEMENTS",
    content: "Describe major telecom site deployments, cutovers, or achievements here."
  });
  saveAndRefresh(true);
}

function updateCustomSec(idx, field, val) {
  cvData.customSections[idx][field] = val;
  saveAndRefresh();
}

function deleteCustomSection(idx) {
  if (confirm("Delete this custom section?")) {
    cvData.customSections.splice(idx, 1);
    saveAndRefresh(true);
  }
}

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    cvData.personal.photo = evt.target.result;
    saveAndRefresh(true);
  };
  reader.readAsDataURL(file);
}

function saveAndRefresh(reRenderForm = false) {
  localStorage.setItem('waqar_cv_custom_data', JSON.stringify(cvData));
  renderCVPreview();
  if (reRenderForm) renderActiveTab();
}

        ${customHtml}
      </main>
    `;
  } catch(err) {
    console.error("renderCVPreview error:", err);
    container.innerHTML = `<div style="padding:20px;color:#ef4444;">Preview Render Error: ${escapeHtml(err.message)}</div>`;
  }
}

function setZoom(val) {
  currentZoom = val;
  applyZoom();
}

function applyZoom() {
  const sheet = document.getElementById('cv-sheet');
  if (sheet) {
    sheet.style.transform = `scale(${currentZoom})`;
  }
}

function exportJSON() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cvData, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "cv_data.json");
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
}

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      cvData = JSON.parse(evt.target.result);
      saveAndRefresh(true);
      alert("Successfully loaded data from " + file.name);
    } catch(err) {
      alert("Invalid JSON: " + err.message);
    }
  };
  reader.readAsText(file);
}

function printCV() {
  window.print();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

window.addEventListener('DOMContentLoaded', initAdmin);
</script>
