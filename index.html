<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waqar Ahmed – Site Engineer | Telecom Team Lead CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<!-- Fallback data script for local file:// execution -->
<script src="cv_data.js"></script>
<style>
:root {
  --bg-desk: #0b0f19;
  --sheet-bg: #ffffff;
  --sidebar-bg-start: #0f172a;
  --sidebar-bg-end: #1e293b;
  --sidebar-text: #e2e8f0;
  --sidebar-muted: #94a3b8;
  --sidebar-accent: #38bdf8;
  
  --primary: #0f172a;
  --primary-blue: #2563eb;
  --primary-blue-dark: #1d4ed8;
  --primary-blue-light: #eff6ff;
  --text-main: #1e293b;
  --text-body: #334155;
  --text-muted: #64748b;
  --border-light: #e2e8f0;
  --card-bg: #f8fafc;
  
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-desk);
  font-family: var(--font-sans);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 10px 40px;
  -webkit-font-smoothing: antialiased;
}

/* Action Bar */
.action-bar {
  width: 100%;
  max-width: 860px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 20px;
  margin-bottom: 20px;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
}

.bar-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #cbd5e1;
}

.bar-status .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
}

.bar-buttons {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
  text-decoration: none;
}

.btn-primary {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
}

.btn-primary:hover {
  background: linear-gradient(135deg, #1d4ed8, #1e40af);
  transform: translateY(-1px);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: #f1f5f9;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.15);
}

/* CV Sheet Container */
.cv-container {
  width: 100%;
  max-width: 860px;
  display: flex;
  justify-content: center;
}

#cv-sheet {
  width: 860px;
  min-height: 1216px;
  background: var(--sheet-bg);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  display: grid;
  grid-template-columns: 290px 1fr;
  position: relative;
}

/* Left Sidebar */
.cv-sidebar {
  background: linear-gradient(180deg, var(--sidebar-bg-start) 0%, var(--sidebar-bg-end) 100%);
  color: var(--sidebar-text);
  padding: 32px 24px 30px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  border-right: 1px solid rgba(255, 255, 255, 0.06);
}

.photo-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.photo-frame {
  width: 154px;
  height: 188px;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.6);
  background: #1e293b;
  position: relative;
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.sidebar-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar-heading {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--sidebar-accent);
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.sidebar-heading svg {
  width: 15px;
  height: 15px;
  stroke: var(--sidebar-accent);
  fill: none;
}

.contact-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.contact-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--sidebar-text);
}

.contact-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.07);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.contact-icon svg {
  width: 14px;
  height: 14px;
  stroke: #38bdf8;
  fill: none;
}

.contact-text a {
  color: inherit;
  text-decoration: none;
  transition: color 0.15s ease;
}

.contact-text a:hover {
  color: #38bdf8;
}

.skills-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.skill-tag {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #f1f5f9;
  font-size: 11px;
  font-weight: 500;
  padding: 4px 9px;
  border-radius: 6px;
}

.skill-tag.accent {
  background: rgba(56, 189, 248, 0.15);
  border-color: rgba(56, 189, 248, 0.35);
  color: #e0f2fe;
}

.lang-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.lang-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}

.lang-name {
  font-weight: 600;
  color: #f8fafc;
}

.lang-level {
  font-size: 10.5px;
  color: var(--sidebar-muted);
  background: rgba(255, 255, 255, 0.05);
  padding: 2px 7px;
  border-radius: 4px;
}

.interests-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.interest-card {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 600;
}

.interest-card svg {
  width: 16px;
  height: 16px;
  stroke: #38bdf8;
  fill: none;
}

/* Right Main Content */
.cv-main {
  padding: 36px 36px 30px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  background: #ffffff;
}

.main-header {
  border-bottom: 2px solid #f1f5f9;
  padding-bottom: 18px;
}

.name-title-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.candidate-name {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--primary);
  line-height: 1.1;
  text-transform: uppercase;
}

.candidate-role {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2.8px;
  color: var(--primary-blue);
  text-transform: uppercase;
  margin-top: 4px;
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--card-bg);
  color: var(--text-muted);
  border: 1px solid var(--border-light);
}

.badge-pill.featured {
  background: #eff6ff;
  color: #1d4ed8;
  border-color: #bfdbfe;
}

.badge-pill svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  fill: none;
}

.section-title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 9px;
  position: relative;
  margin-bottom: 12px;
}

.section-title-icon {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: #eff6ff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.section-title-icon svg {
  width: 14px;
  height: 14px;
  stroke: var(--primary-blue);
  fill: none;
}

.section-title::after {{
  content: "";
  flex: 1;
  height: 1px;
  background: #e2e8f0;
  margin-left: 10px;
}}

.profile-text {
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--text-body);
  text-align: justify;
  background: #f8fafc;
  padding: 12px 16px;
  border-radius: 8px;
  border-left: 3px solid var(--primary-blue);
}

.timeline {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-left: 16px;
}

.timeline::before {
  content: "";
  position: absolute;
  top: 6px;
  bottom: 6px;
  left: 4px;
  width: 2px;
  background: #e2e8f0;
}

.timeline-item {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.timeline-dot {
  position: absolute;
  left: -16px;
  top: 5px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ffffff;
  border: 2.5px solid var(--primary-blue);
  box-shadow: 0 0 0 2px #eff6ff;
}

.timeline-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}

.timeline-role {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--primary);
}

.timeline-date {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--primary-blue-dark);
  background: var(--primary-blue-light);
  padding: 2px 8px;
  border-radius: 12px;
  letter-spacing: 0.3px;
}

.timeline-org {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.timeline-bullets {
  margin-top: 5px;
  padding-left: 16px;
  display: flex;
  flex-direction: column;
  gap: 3.5px;
}

.timeline-bullets li {
  font-size: 11.8px;
  line-height: 1.48;
  color: var(--text-body);
}

.cert-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.cert-card {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  position: relative;
}

.cert-year {
  font-size: 10px;
  font-weight: 700;
  color: var(--primary-blue);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.cert-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.3;
}

.cert-issuer {
  font-size: 10.5px;
  color: var(--text-muted);
  line-height: 1.35;
}

/* Custom Dynamic Section (if added) */
.custom-section-item {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
}

/* Print Stylesheet */
@media print {
  @page {
    size: A4 portrait;
    margin: 0;
  }
  
  html, body {
    background: #ffffff !important;
    padding: 0 !important;
    margin: 0 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  .action-bar {
    display: none !important;
  }
  
  .cv-container {
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  
  #cv-sheet {
    width: 210mm !important;
    min-height: 297mm !important;
    max-height: 297mm !important;
    box-shadow: none !important;
    border-radius: 0 !important;
  }
}

@media screen and (max-width: 900px) {
  body {
    padding: 10px 5px;
  }
  .action-bar {
    border-radius: 8px;
    padding: 10px 14px;
  }
}
</style>
</head>
<body>

<!-- Top Clean Action Bar -->
<div class="action-bar">
  <div class="bar-status">
    <div class="status-dot"></div>
    <span><strong>Waqar Ahmed</strong> • Professional Curriculum Vitae</span>
  </div>
  <div class="bar-buttons">
    <a href="admin_cv.html" class="btn btn-secondary" title="Open Admin & Feature Management Studio">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Admin &amp; Editor
    </a>
    <button class="btn btn-primary" onclick="window.print()" title="Print or Save as PDF">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Download PDF / Print
    </button>
  </div>
</div>

<!-- Main Read-Only CV Canvas -->
<div class="cv-container">
  <div id="cv-sheet">
    <!-- Rendered dynamically from cv_data.json -->
  </div>
</div>

<script>
async function loadAndRenderCV() {
  let data = null;
  
  // 1. Fetch cv_data.json (fresh with cache-buster)
  try {
    const res = await fetch('./cv_data.json?t=' + Date.now());
    if (res.ok) {
      data = await res.json();
    }
  } catch (err) {
    console.log("Direct fetch failed (likely file:// protocol), using window.CV_DEFAULT_DATA fallback.");
  }
  
  // 2. Fallback to cv_data.js
  if (!data && window.CV_DEFAULT_DATA) {
    data = window.CV_DEFAULT_DATA;
  }
  
  if (data) {
    renderCV(data);
  } else {
    document.getElementById('cv-sheet').innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444;">Failed to load cv_data.json. Please ensure cv_data.json is present.</div>';
  }
}

function renderCV(data) {
  const container = document.getElementById('cv-sheet');
  if (!container || !data) return;

  const { personal, contact, profile, skills, languages, interests, experience, education, certifications, customSections } = data;

  // Badges
  const badgesHtml = (personal.badges || []).map(b => `
    <span class="badge-pill ${b.featured ? 'featured' : ''}">
      ${b.icon === 'shield' ? '<svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' : '<svg viewBox="0 0 24 24" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>'}
      <span>${escapeHtml(b.label)}</span>
    </span>
  `).join('');

  // Skills
  const skillsHtml = (skills || []).map(s => `
    <span class="skill-tag ${s.accent ? 'accent' : ''}">${escapeHtml(s.name)}</span>
  `).join('');

  // Languages
  const langHtml = (languages || []).map(l => `
    <div class="lang-row">
      <span class="lang-name">${escapeHtml(l.language)}</span>
      <span class="lang-level">${escapeHtml(l.level)}</span>
    </div>
  `).join('');

  // Interests
  const interestsHtml = (interests || []).map(item => `
    <div class="interest-card">
      ${item.icon === 'music' ? '<svg viewBox="0 0 24 24" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>' : '<svg viewBox="0 0 24 24" stroke-width="2"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>'}
      <span>${escapeHtml(item.name)}</span>
    </div>
  `).join('');

  // Experience
  const expHtml = (experience || []).map(exp => `
    <div class="timeline-item">
      <div class="timeline-dot"></div>
      <div class="timeline-header">
        <span class="timeline-role">${escapeHtml(exp.role)}</span>
        <span class="timeline-date">${escapeHtml(exp.period)}</span>
      </div>
      <div class="timeline-org">${escapeHtml(exp.organization)} • ${escapeHtml(exp.location)}</div>
      <ul class="timeline-bullets">
        ${(exp.bullets || []).map(b => `<li>${escapeHtml(b)}</li>`).join('')}
      </ul>
    </div>
  `).join('');

  // Education
  const eduHtml = (education || []).map(edu => `
    <div class="timeline-item">
      <div class="timeline-dot"></div>
      <div class="timeline-header">
        <span class="timeline-role">${escapeHtml(edu.degree)}</span>
        <span class="timeline-date">${escapeHtml(edu.year)}</span>
      </div>
      <div class="timeline-org">${escapeHtml(edu.institution)} • ${escapeHtml(edu.location)}</div>
    </div>
  `).join('');

  // Certifications
  const certHtml = (certifications || []).map(cert => `
    <div class="cert-card">
      <span class="cert-year">${escapeHtml(cert.year)}</span>
      <span class="cert-name">${escapeHtml(cert.title)}</span>
      <span class="cert-issuer">${escapeHtml(cert.issuer)}</span>
    </div>
  `).join('');

  // Custom Sections (if defined)
  const customSectionsHtml = (customSections || []).map(sec => `
    <section>
      <div class="section-title">
        <div class="section-title-icon">
          <svg viewBox="0 0 24 24" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        ${escapeHtml(sec.title)}
      </div>
      <div class="custom-section-item">
        ${escapeHtml(sec.content)}
      </div>
    </section>
  `).join('');

  container.innerHTML = `
    <!-- Left Sidebar -->
    <aside class="cv-sidebar">
      <div class="photo-wrapper">
        <div class="photo-frame">
          <img src="${data.personal.photo}" alt="${escapeHtml(data.personal.name)} Photo">
        </div>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-heading">
          <svg viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          CONTACT
        </div>
        <div class="contact-list">
          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <div class="contact-text">
              <a href="mailto:${escapeHtml(contact.email)}">${escapeHtml(contact.email)}</a>
            </div>
          </div>
          
          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
            </div>
            <div class="contact-text">
              <a href="tel:${escapeHtml(contact.phone)}">${escapeHtml(contact.phone)}</a>
            </div>
          </div>
          
          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="contact-text">
              ${escapeHtml(contact.address)}
            </div>
          </div>
        </div>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-heading">
          <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          TECHNICAL SKILLS
        </div>
        <div class="skills-wrap">
          ${skillsHtml}
        </div>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-heading">
          <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          LANGUAGES
        </div>
        <div class="lang-list">
          ${langHtml}
        </div>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-heading">
          <svg viewBox="0 0 24 24" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          INTERESTS
        </div>
        <div class="interests-grid">
          ${interestsHtml}
        </div>
      </div>
    </aside>
    
    <!-- Right Main Content -->
    <main class="cv-main">
      <header class="main-header">
        <div class="name-title-group">
          <h1 class="candidate-name">${escapeHtml(personal.name)}</h1>
          <div class="candidate-role">${escapeHtml(personal.role)}</div>
        </div>
        <div class="badge-row">
          ${badgesHtml}
        </div>
      </header>
      
      <section>
        <div class="section-title">
          <div class="section-title-icon">
            <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          </div>
          PROFESSIONAL PROFILE
        </div>
        <p class="profile-text">
          ${escapeHtml(profile)}
        </p>
      </section>
      
      <section>
        <div class="section-title">
          <div class="section-title-icon">
            <svg viewBox="0 0 24 24" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v3"/></svg>
          </div>
          WORK EXPERIENCE
        </div>
        <div class="timeline">
          ${expHtml}
        </div>
      </section>
      
      <section>
        <div class="section-title">
          <div class="section-title-icon">
            <svg viewBox="0 0 24 24" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          </div>
          EDUCATION
        </div>
        <div class="timeline">
          ${eduHtml}
        </div>
      </section>
      
      <section>
        <div class="section-title">
          <div class="section-title-icon">
            <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
          </div>
          CERTIFICATIONS &amp; CREDENTIALS
        </div>
        <div class="cert-grid">
          ${certHtml}
        </div>
      </section>

      ${customSectionsHtml}
    </main>
  `;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function fitToScreen() {
  const sheet = document.getElementById('cv-sheet');
  if (!sheet) return;
  const availableWidth = window.innerWidth - 30;
  if (availableWidth < 860) {
    const scale = Math.min(1, availableWidth / 860);
    sheet.style.transform = `scale(${scale})`;
    sheet.style.transformOrigin = 'top center';
    sheet.parentElement.style.height = `${1216 * scale}px`;
  } else {
    sheet.style.transform = 'none';
    sheet.parentElement.style.height = 'auto';
  }
}

window.addEventListener('resize', fitToScreen);
window.addEventListener('DOMContentLoaded', () => {
  loadAndRenderCV().then(fitToScreen);
});
</script>
